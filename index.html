<style>
:root{--bg:#F8FAFC;--sf:#FFFFFF;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;--pb:#2563EB;--ay:#FACC15;--gr:#10B981;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--sf:#111B2E;--tx:#E5EDFA;--mu:#94A3B8;--bd:#22324D;color-scheme:dark}}

html{scroll-padding-top:110px;scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px}
.mu{color:var(--mu)}.bd{border-color:var(--bd)}.sf{background:var(--sf)}
.btn{border-radius:12px;padding:.6rem 1.1rem;font-weight:700;font-size:.875rem;transition:.15s;cursor:pointer}
.btn-p{background:var(--pb);color:#fff}.btn-p:hover{filter:brightness(1.1)}
.btn-o{border:1.5px solid var(--pb);color:var(--pb)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.chip{border:1px solid var(--bd);border-radius:999px;padding:.3rem .8rem;font-size:.8rem;font-weight:600;cursor:pointer;background:var(--sf)}
.chip.on{background:var(--pb);color:#fff;border-color:var(--pb)}
.inp{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:.6rem .8rem;font-size:.9rem}
.gold{background:var(--ay);color:#422006;border-radius:999px;font-size:.7rem;font-weight:800;padding:.15rem .6rem}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}.bar>i{display:block;height:100%;background:var(--pb);transition:width .5s}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ay);outline-offset:2px}
</style>
<style>
:root{--bg:#fff;--sf:#fff;--tx:#172554;--mu:#64748b;--bd:#e7eaf2;--pb:#4f46e5;--ay:#facc15;--gr:#10b981}
body{background:#fff;color:#172554;letter-spacing:-.01em}
header.sticky{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-color:#eef0f5;box-shadow:0 4px 24px rgba(30,41,59,.04)}
#app{max-width:1180px}
#beranda{position:relative;isolation:isolate;min-height:460px;margin-top:24px;padding:64px 56px;border-radius:32px;background:radial-gradient(ellipse at 82% 24%,#e9e7ff 0,transparent 36%),linear-gradient(135deg,#f7f6ff 0%,#fbfbff 60%,#fff8db 100%);overflow:hidden}

#beranda [class~="md:col-span-2"]{gap:14px;margin-top:20px}
#beranda [class~="md:col-span-2"] .card{background:rgba(255,255,255,.86);border:1px solid rgba(226,225,245,.9);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(31,35,82,.05);transition:transform .2s,box-shadow .2s}

<style>
:root{--pb:#4f46d8;--bg:#f8fbff;--sf:#fff;--tx:#18202c;--mu:#626d7e;--bd:#e6edf2}
body{background-color:#f8fbff;background-image:radial-gradient(circle,rgba(95,138,164,.12) .8px,transparent .9px),radial-gradient(ellipse at 12% 13%,rgba(176,235,250,.45),transparent 31%),radial-gradient(ellipse at 87% 20%,rgba(224,247,160,.38),transparent 28%);background-size:18px 18px,auto,auto;background-attachment:fixed;color:#17202c}

#nav1{gap:.85rem;font-size:.78rem;white-space:nowrap}
.brand-mascot{width:38px;height:38px;object-fit:cover;object-position:center;border-radius:0}

#beranda{max-width:none;min-height:0;margin:0 -1rem;padding:62px max(2rem,calc((100vw - 1120px)/2)) 38px;border-radius:0;background:transparent;overflow:visible;row-gap:24px}

#beranda h1{max-width:700px;font-size:clamp(3rem,6.5vw,5rem);line-height:.99;letter-spacing:-.065em;color:#111820}
#beranda>div:first-child>p{max-width:570px;color:#697383;font-size:1.12rem;line-height:1.65}
.eyebrow{font-weight:700;font-size:.88rem;color:#586678}
#beranda .gold{background:#edebff;color:#5146c8}
#beranda .btn{padding:.82rem 1.35rem}
#beranda .btn-p{background:#4f46d8;box-shadow:0 8px 20px rgba(79,70,216,.18)}
#beranda .btn-o{color:#4f46d8;border-color:#d9d7f0;background:#fff}
.hero-mascot-wrap{position:relative;min-height:480px;align-items:center;border-radius:0;background:transparent}
#beranda>div:nth-child(2){background:transparent!important;border-radius:0}
.hero-mascot-wrap>.learnee-mascot{height:410px;width:300px!important;object-fit:cover;object-position:center;transform:translate(20px,12px);filter:drop-shadow(0 16px 14px rgba(47,88,105,.12))}
.mascot-note{position:absolute;z-index:1;top:0;left:0;padding:11px 16px;background:#fff;border:1px solid #edf0f4;border-radius:16px;box-shadow:0 7px 18px rgba(34,51,68,.1);font-size:.8rem;font-weight:800;color:#273244}

.study-art>.learnee-mascot{height:370px;width:270px!important;object-fit:cover;object-position:center;transform:translateY(8px);filter:drop-shadow(0 14px 13px rgba(47,88,105,.12))}
.study-note{position:absolute;right:0;bottom:0;padding:11px 15px;border:1px solid #ebeff3;border-radius:16px;background:#fff;box-shadow:0 7px 18px rgba(34,51,68,.08);font-size:.76rem;font-weight:800;color:#527e45}
#beranda>div:nth-child(2),.hero-mascot-wrap,.study-story,.study-art{background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important}
.hero-mascot-wrap>.learnee-mascot,.study-art>.learnee-mascot{background:none!important;border:0!important;box-shadow:none!important;filter:drop-shadow(0 16px 18px rgba(28,52,68,.24))!important}
.learning-hub{padding:24px;border:1px solid rgba(225,234,239,.9);border-radius:26px;background:rgba(255,255,255,.88);box-shadow:0 10px 30px rgba(44,68,83,.05)}
.learning-hub .card{background:#fff;border-color:#e8edf2}
.learning-hub .chip:not(.on){background:#fff;color:#556174;border-color:#e5ebf0}
.learning-hub-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.learning-hub-head h3{font-size:1.45rem;letter-spacing:-.04em;color:#17202c}

.learning-hub-head .hub-switch{margin-left:auto;display:flex;gap:8px}

.learning-hub .content-tabs{margin-top:17px;margin-bottom:16px;padding-bottom:15px;border-bottom:1px solid #e8edf2}
#sesi,#fasilitas,#tentang,#testimoni,#faq{padding-top:64px}
@media(max-width:1023px){#nav1{gap:.55rem;font-size:.7rem}}
@media(max-width:767px){#beranda{margin:0 -1rem;padding:36px 22px 26px;row-gap:14px}#beranda h1{font-size:2.8rem}#beranda>div:nth-child(2){min-height:430px!important}.hero-mascot-wrap{min-height:430px}.hero-mascot-wrap>.learnee-mascot{height:350px;width:255px!important;object-fit:cover;object-position:center;transform:translate(20px,12px)}.mascot-note{top:0;left:0}.mascot-note-bottom{top:auto;bottom:0;right:0}.study-story{grid-template-columns:1fr;gap:8px;padding:38px 12px 25px}.study-copy h2{font-size:2.8rem}.study-art{min-height:430px}.study-art>.learnee-mascot{height:310px;width:230px!important;object-fit:cover;object-position:center;transform:translateY(8px)}.study-note{right:0;bottom:0}.learning-hub{padding:16px;border-radius:20px}.learning-hub-head .hub-switch{margin-left:0}#nav1{font-size:.75rem}}
</style>

<body>
<header class="sticky top-0 z-50 sf border-b bd" style="top:0">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 justify-between">
    <a href="#beranda" onclick="go('student')" class="flex items-center gap-2 font-extrabold text-xl" style="color:var(--pb)">
      <img src="./assets/maskot-bandeng.png?v=2" alt="" class="brand-mascot">Learnee</a>
    <nav class="hidden lg:flex gap-5 text-sm font-semibold" id="nav1"></nav>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <span id="net" class="text-xs font-bold px-3 py-1 rounded-full"></span>
      <button class="btn bd border text-xs" id="offBtn" onclick="toggleOff()"></button>
      <select id="role" class="inp !w-auto !py-1.5 text-xs font-bold" onchange="go(this.value)" aria-label="Switch role">
        <option value="student">Siswa</option><option value="teacher">Guru</option><option value="admin">Admin</option></select>
      <button class="btn btn-p hidden sm:block" onclick="go('student','sesi')">Mulai Belajar Gratis</button>
    </div>
  </div>
  <nav class="lg:hidden flex gap-4 px-4 pb-2 overflow-x-auto text-sm font-semibold whitespace-nowrap" id="nav2"></nav>
</header>
<div id="offBanner"></div>
<main id="app" class="max-w-6xl mx-auto px-4 pb-24"></main>
<div id="modal" onclick="if(event.target.id==='modal'&&S.modal&&S.modal.t!=='rate')closeM()"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[70] hidden px-4 py-2 rounded-xl text-sm font-bold text-white" style="background:#0F172A"></div>
<button onclick="helpLee()" aria-label="Bantuan Lee" class="fixed right-4 bottom-4 z-40 card p-1 shadow-lg" style="border-radius:999px" id="fab"></button>

<script>
/* ---------- Data ---------- */
const SN=['PU','PPU','PBM','PK','Literasi B. Indonesia','Literasi B. Inggris','Penalaran Matematika'];
const TK=['Matematika Lanjut','Fisika','Kimia','Biologi','Ekonomi','Sosiologi','Geografi','Sejarah'];
const BANK={
'PK':{s:'Konsep inti: bilangan, aljabar dasar, perbandingan, dan peluang sederhana. Selalu ubah soal cerita menjadi persamaan sebelum menghitung.',q:[['Jika 3x + 5 = 20, nilai 2x adalah…',['5','10','15','7'],1,'3x = 15 → x = 5 → 2x = 10.']]},
'Fisika':{s:'Konsep inti: GLB, GLBB, Hukum Newton, usaha-energi. Gunakan diagram gaya sebelum memasukkan rumus.',q:[['Benda 2 kg dipercepat 3 m/s². Gaya resultan?',['3 N','5 N','6 N','1,5 N'],2,'F = m·a = 2×3 = 6 N.']]},
'Kimia':{s:'Konsep inti: stoikiometri, mol, larutan, dan kesetimbangan. Mol adalah jembatan antara massa dan jumlah partikel.',q:[['Mol dari 36 g air (Mr 18)?',['1','2','3','0,5'],1,'mol = massa/Mr = 36/18 = 2.']]},
'Ekonomi':{s:'Konsep inti: permintaan-penawaran, elastisitas, inflasi, dan kebijakan fiskal-moneter.',q:[['Jika harga naik dan permintaan turun, hukum yang berlaku?',['Hukum Penawaran','Hukum Permintaan','Hukum Gossen','Hukum Say'],1,'Harga naik → jumlah diminta turun = Hukum Permintaan.']]},
'Literasi B. Inggris':{s:'Konsep inti: main idea, inference, dan vocabulary in context. Baca pertanyaan dulu, lalu pindai teks.',q:[['"Scarce" paling dekat artinya…',['Abundant','Rare','Cheap','Heavy'],1,'Scarce = langka = rare.']]},
'PU':{s:'Konsep inti: penalaran induktif, deduktif, dan kuantitatif. Cari pola sebelum menghitung.',q:[['Pola 2, 4, 8, 16, … angka berikutnya?',['24','30','32','20'],2,'Setiap suku dikali 2 → 16×2 = 32.']]}};
const getBank=s=>BANK[s]||{s:'Ringkasan '+s+': pahami konsep inti, hafalkan istilah kunci, lalu latihan soal bertahap dari mudah ke sulit. Tandai topik yang sering muncul di SNBT/TKA.',q:[['Langkah pertama terbaik saat mengerjakan soal '+s+'?',['Menebak cepat','Memahami perintah soal','Melihat opsi terakhir','Melewati semuanya'],1,'Memahami perintah soal mencegah salah tafsir.']]};
const DEF={role:'student',off:false,tab:'SNBT',subj:'PK',sub:'sum',mf:'all',faq:'siswa',faqOpen:-1,
 mentors:[
 {id:'m1',n:'Kak Dimas Pratama',sp:['PK','PU','Penalaran Matematika','Matematika Lanjut'],mode:'both',city:'Surabaya',price:45000,r:4.8,rc:32,free:2,c:'#2563EB'},
 {id:'m2',n:'Bu Sari Wulandari',sp:['Fisika','Kimia','Biologi'],mode:'online',city:'Malang',price:50000,r:4.9,rc:41,free:0,c:'#10B981'},
 {id:'m3',n:'Kak Rafi Mahendra',sp:['Literasi B. Inggris','PBM','Literasi B. Indonesia'],mode:'both',city:'Jakarta',price:40000,r:4.7,rc:18,free:3,c:'#F59E0B'},
 {id:'m4',n:'Pak Hendra Kusuma',sp:['Ekonomi','Sosiologi','Geografi','Sejarah'],mode:'offline',city:'Surabaya',price:35000,r:4.6,rc:25,free:1,c:'#8B5CF6'},
 {id:'m5',n:'Kak Nadia (Mentor Baru)',sp:['PPU','PBM','PU','PK','Fisika','Ekonomi'],mode:'both',city:'Sidoarjo',price:30000,r:0,rc:0,free:3,c:'#EC4899',demo:1}],
 sessions:[],reviews:[],materials:[],
 T:{reg:false,name:'',email:'',file:'',doc:'none',free:0,bal:0,claimed:false}};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('learnee_v1')||'{}'))}catch(e){S=JSON.parse(JSON.stringify(DEF))}
S.modal=null;
const save=()=>{try{const{modal,...x}=S;localStorage.setItem('learnee_v1',JSON.stringify(x))}catch(e){}};
/* Offline cache: seluruh ringkasan & bank soal di-prefetch ke localStorage */
try{const c={};[...SN,...TK].forEach(s=>c[s]=getBank(s));localStorage.setItem('learnee_cache',JSON.stringify(c))}catch(e){}
const isOff=()=>S.off||!navigator.onLine;
const rp=n=>n?'Rp '+n.toLocaleString('id-ID'):'Rp 0 (Sesi Gratis)';
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),2800)};
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));

/* ---------- Maskot Lee ---------- */
function lee(v='hero',w=170){
 return `<img src="./assets/maskot-bandeng.png?v=2" width="${w}" alt="Maskot Learnee" class="learnee-mascot mascot-${v}" style="width:${w}px">`;
}

/* ---------- Navigasi & status ---------- */
const NAV=[['Beranda','beranda'],['Tentang Kami','tentang'],['Sesi SNBT','sesi','SNBT'],['Sesi TKA','sesi','TKA'],['Fasilitas','fasilitas'],['Testimoni','testimoni'],['FAQ','faq']];
function chrome(){
 const h=NAV.map(n=>`<a href="#${n[1]}" onclick="${n[2]?`S.tab='${n[2]}';S.subj=${n[2]==='SNBT'?`'PK'`:`'Fisika'`};render()`:'go(\'student\')'}" class="hover:underline" style="color:var(--tx)">${n[0]}</a>`).join('');
 $('#nav1').innerHTML=h;$('#nav2').innerHTML=h;
 const o=isOff(),n=$('#net');
 n.textContent=o?'● Mode Offline':'● Status: Online';
 n.style.cssText=o?'background:#FEF9C3;color:#854D0E':'background:#D1FAE5;color:#047857';
 $('#offBtn').textContent=S.off?'Kembali Online':'Simulasi Offline';
 $('#role').value=S.role;
 $('#offBanner').innerHTML=o?`<div class="bg-amber-100 border-b border-amber-300"><div class="max-w-6xl mx-auto px-4 py-2 flex items-center gap-3 text-amber-900 text-sm">${lee('offline',54)}<p><b>Lee di sini!</b> Kamu sedang offline. Ringkasan Materi & Bank Soal tetap bisa dibuka. Chat, video, upload dokumen, dan klaim fee aktif lagi saat online.</p></div></div>`:'';
 $('#fab').innerHTML=lee('help',48);
}
function go(r,sec){S.role=r;S.modal=null;render();if(sec)setTimeout(()=>document.getElementById(sec)?.scrollIntoView(),50);else scrollTo(0,0)}
function toggleOff(){S.off=!S.off;save();render();if(S.modal&&S.modal.t==='chat')openChat(S.modal.id)}
window.addEventListener('online',render);window.addEventListener('offline',render);
function helpLee(){openM(`<div class="card p-6 max-w-sm text-center">${lee('help',110)}<h3 class="font-extrabold text-lg mt-2">Hai, aku Lee!</h3><p class="mu text-sm mt-1">${isOff()?'Kamu offline, tapi materi tersimpan tetap bisa dibaca. Buka tab Sesi lalu pilih Ringkasan atau Bank Soal.':'Butuh bantuan? Pilih mentor di tab Sesi, lalu klaim sesi gratis jika tersedia.'}</p><button class="btn btn-p mt-4" onclick="closeM()">Siap, Lee!</button></div>`)}

/* ---------- Modal ---------- */
function openM(h,st){S.modal=st||{t:'x'};const m=$('#modal');m.innerHTML=h;m.classList.add('show')}
function closeM(){S.modal=null;$('#modal').classList.remove('show');$('#modal').innerHTML=''}

/* ---------- Render ---------- */
function render(){chrome();$('#app').innerHTML=S.role==='teacher'?teacherView():S.role==='admin'?adminView():studentView();save()}

function mentorCard(m,compact){
 const off=isOff();
 return `<div class="card p-4 flex flex-col gap-2"><div class="flex gap-3 items-center"><div class="w-12 h-12 rounded-full text-white font-extrabold flex items-center justify-center shrink-0" style="background:${m.c}">${m.n.replace(/^(Kak|Bu|Pak) /,'')[0]}</div><div class="min-w-0"><div class="font-bold truncate">${m.n}</div><div class="text-xs mu">${m.city} · ${m.mode==='both'?'Online & Offline':m.mode==='online'?'Online':'Offline'}</div></div></div>
 <div class="text-sm" style="color:#CA8A04">${m.rc?stars(m.r)+` <span class="mu">${m.r.toFixed(1)} (${m.rc})</span>`:'<span class="mu">Belum ada rating</span>'}</div>
 <div class="text-xs mu">${m.sp.join(', ')}</div>
 <div class="flex items-center justify-between mt-auto pt-2"><div><div class="font-extrabold text-sm">${rp(m.free>0?0:m.price)}</div>${m.free>0?`<span class="gold">Sesi Gratis Tersedia (${m.free})</span>`:`<span class="text-xs mu">/ sesi 45 menit</span>`}</div>
 <button class="btn btn-p" onclick="openBook('${m.id}')">Konsultasi</button></div></div>`;
}
function studentView(){
 const list=S.tab==='SNBT'?SN:TK, bank=getBank(S.subj);
 const ments=S.mentors.filter(m=>m.sp.includes(S.subj)&&(S.mf==='all'||m.mode===S.mf||m.mode==='both'));
 const off=isOff();
