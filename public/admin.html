<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learnee — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="./style.css">
<style>html.cek-login body{visibility:hidden}</style>
<link rel="icon" type="image/png" href="./assets/maskot-bandeng-logo.png?v=1">
<link rel="apple-touch-icon" href="./assets/maskot-bandeng-logo.png?v=1">
<meta name="theme-color" content="#4f46e5"></head>
<body>
<header class="sticky top-0 z-50 sf border-b bd">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="./index.html" class="brand-link flex items-center gap-2 font-extrabold text-xl"><img src="./assets/maskot-bandeng-logo.png?v=1" alt="" class="brand-mascot">Learnee <span class="text-sm mu">Admin Workspace</span></a>
    <div class="flex items-center gap-2">
      <span id="net" class="text-xs font-bold px-3 py-1 rounded-full"></span>
      <span id="emailAdmin" class="text-xs mu hidden sm:inline"></span>
      <a class="btn bd border text-xs" href="./index.html">Kembali ke situs</a>
      <button id="btnLogout" type="button" class="btn bd border text-xs">Logout</button>
    </div>
  </div>
</header>
<main id="app" class="max-w-6xl mx-auto px-4 pb-24"></main>
<div id="modal"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[70] hidden px-4 py-2 rounded-xl text-sm font-bold text-white" role="status" aria-live="polite"></div>

<script>document.documentElement.classList.add("cek-login");</script>
<script src="./js/supabase-config.js"></script>
<script type="module">
  import { auth } from "./js/firebase-config.js";
  import { onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  function muatScript(src) {
    return new Promise((ok, gagal) => {
      const s = document.createElement("script");
      s.src = src; s.async = false;
      s.onload = ok; s.onerror = gagal;
      document.body.appendChild(s);
    });
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { location.replace("login.html"); return; }

    document.getElementById("emailAdmin").textContent = user.email;
    document.getElementById("btnLogout").onclick = () =>
      signOut(auth).then(() => location.replace("login.html"));
    window.learneeFirebaseUser = user;
    window.learneeFirebaseIdentity = async () => ({
      uid: user.uid,
      email: user.email,
      token: await user.getIdToken()
    });

    // muat script aplikasi berurutan, hanya setelah login terverifikasi
    await muatScript("./js/supabase-api.js");
    await muatScript("./content-bank.js");
    await muatScript("./question-engine.js");
    await muatScript("./script.js");

    document.documentElement.classList.remove("cek-login");
  });
</script>
</body>
</html>
