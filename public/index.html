<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learnee — Belajar Bebas Batas, Tembus PTN Impian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&disp=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- Site header and navigation -->
<header class="sticky top-0 z-50 sf border-b bd">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 justify-between">
    <a href="#beranda" data-action="home" class="brand-link flex items-center gap-2 font-extrabold text-xl">
      <img src="./assets/maskot-bandeng.png?v=2" alt="" class="brand-mascot">Learnee</a>
    <nav class="hidden lg:flex gap-5 text-sm font-semibold" id="nav1"></nav>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <span id="net" class="text-xs font-bold px-3 py-1 rounded-full"></span>
      <select id="role" class="inp !w-auto !py-1.5 text-xs font-bold" aria-label="Pilih tampilan">
        <option value="student">Siswa</option><option value="teacher">Guru</option><option value="admin">Admin</option></select>
      <button class="btn btn-p hidden sm:block" type="button" data-action="start-learning">Mulai Belajar Gratis</button>
    </div>
  </div>
  <nav class="lg:hidden flex gap-4 px-4 pb-2 overflow-x-auto text-sm font-semibold whitespace-nowrap" id="nav2"></nav>
</header>
<!-- Main content is rendered by the application -->
<main id="app" class="max-w-6xl mx-auto px-4 pb-24"></main>
<!-- Modal, toast, and quick help controls -->
<div id="modal"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[70] hidden px-4 py-2 rounded-xl text-sm font-bold text-white" role="status" aria-live="polite"></div>

<!-- Application logic -->
<script src="./script.js"></script>
</body>
</html>
